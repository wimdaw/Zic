name: apk

# A manual run uploads artifacts for 14 days.
# A v* tag builds the arm64 release and publishes it. Installed copies
# prompt on the next update check and open that asset in the browser.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: 3.50 requires AGP >= 9.1.1 but this project stays on
          # AGP 8.13 on purpose (flutter_inappwebview 6.1.x is not
          # AGP-9-compatible). 3.47.8 is the stable this codebase targets.
          flutter-version: 3.47.8
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos: material.dart deprecation infos must not fail.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Release keystore
        id: keystore
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set — falling back to the runner debug keystore (fork build)."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/zic-release.keystore"
          echo "ZIC_KEYSTORE=$RUNNER_TEMP/zic-release.keystore" >> "$GITHUB_ENV"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          ZIC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZIC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZIC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${ZIC_KEYSTORE:-}" ]]; then
            if [ -z "${ZIC_KEYSTORE_PASSWORD}" ] || [ -z "${ZIC_KEY_ALIAS}" ] || [ -z "${ZIC_KEY_PASSWORD}" ]; then
              echo "::error::release signing secrets are incomplete"
              exit 1
            fi
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            flutter build apk --release --target-platform android-arm64 --dart-define=APP_CHANNEL=github
          else
            flutter build apk --release --dart-define=APP_CHANNEL=github
            flutter build apk --release --split-per-abi --dart-define=APP_CHANNEL=github
          fi

      - name: Check release certificate
        # Only meaningful when the build used the pinned release keystore.
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.has_keystore == 'true'
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          bt=$(ls -d "$sdk"/build-tools/* | sort -V | tail -1)
          digest=$("$bt/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)
          expected=f9c15ec45983bf9b09b354775b9383f3539a29cb7a4e047e6fcd60136f2e9947
          echo "certificate SHA-256: $digest"
          if [ "$digest" != "$expected" ]; then
            echo "::error::APK certificate does not match the published app"
            exit 1
          fi

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zic-apks
          retention-days: 14
          if-no-files-found: warn
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="zic-${VERSION}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$ASSET"
          # checkout leaves a lightweight tag, so %(contents) is the commit
          # message. Fetch the annotated tag and use that text.
          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force
          git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" > release-notes.txt
          if [ ! -s release-notes.txt ]; then
            printf 'Zic %s\n' "$VERSION" > release-notes.txt
          fi
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "$VERSION" \
            --notes-file release-notes.txt
